<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>BookSpa — Tu belleza comienza con una cita</title>
<meta name="theme-color" content="#2E4A38">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BookSpa">
<link id="apple-touch-icon-link" rel="apple-touch-icon" href="">
<link id="manifest-link" rel="manifest" href="">
<link id="favicon-link" rel="icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
<style>
  :root{
    --bg: #EDE7D5;
    --surface: #FFFFFF;
    --surface-tint: #E7E0C8;
    --ink: #16211A;
    --ink-soft: #3E4C42;
    --primary: #2E4A38;
    --primary-dark: #182A1F;
    --sage: #6C8E77;
    --accent: #B85A6B;
    --accent-dark: #8C3A4A;
    --accent-soft: #E6C2C6;
    --line: #D6CBA9;
    --gold: #AD8232;
    --danger: #9A362F;
    --warn: #A5721F;
    --ok: #2E4A38;
    --radius: 18px;
    --radius-sm: 12px;
    --shadow: 0 10px 30px -12px rgba(20,30,24,0.28);
    --shadow-sm: 0 4px 14px -6px rgba(20,30,24,0.22);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Outfit',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,h4{
    font-family:'Fraunces',serif;
    font-weight:600;
    margin:0 0 .4em 0;
    letter-spacing:-0.01em;
    color:var(--primary-dark);
  }
  p{margin:0 0 1em 0; color:var(--ink-soft); line-height:1.55;}
  a{color:inherit;}
  button{font-family:inherit;}
  #app{max-width:900px;margin:0 auto;padding-bottom:80px;min-height:100vh;position:relative;}
  .container{padding:0 20px;}

  /* ---- Buttons ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 22px;border-radius:999px;border:none;cursor:pointer;
    font-size:15px;font-weight:600;font-family:'Outfit',sans-serif;
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
    text-decoration:none;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{background:#B9C3BC;cursor:not-allowed;box-shadow:none;}
  .btn-accent{background:var(--accent);color:#fff;box-shadow:var(--shadow-sm);}
  .btn-accent:hover{background:var(--accent-dark);}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-outline:hover{background:var(--surface-tint);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-block{width:100%;}
  .btn-sm{padding:9px 16px;font-size:13px;}
  .link-btn{background:none;border:none;color:var(--primary);font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline;}

  /* ---- Nav / Header ---- */
  .topbar{
    position:sticky;top:0;z-index:40;background:rgba(247,245,238,0.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{max-width:900px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .brand-mark{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--sage),var(--primary));display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Fraunces',serif;font-size:18px;overflow:hidden;}
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:19px;color:var(--primary-dark);}
  .credit-line{font-size:11.5px;color:#A6316F;margin:2px 0 0 48px;}
  .credit-line b{color:#5B2382;font-weight:700;}
  .credit-line.centered{margin:8px 0 0 0;text-align:center;}
  .nav-links{display:flex;gap:6px;}
  .nav-links button{background:none;border:none;color:var(--ink-soft);font-weight:600;font-size:13.5px;padding:8px 10px;border-radius:8px;cursor:pointer;}
  .nav-links button.active{color:var(--primary);background:var(--surface-tint);}

  /* ---- Hero ---- */
  .hero{position:relative;padding:56px 20px 90px;overflow:hidden;text-align:center;}
  .hero-bg{position:absolute;inset:0;background:radial-gradient(circle at 20% 20%, #D3E0CE 0%, transparent 55%), radial-gradient(circle at 85% 15%, var(--accent-soft) 0%, transparent 50%), linear-gradient(180deg,var(--bg) 0%, var(--surface-tint) 100%);z-index:-1;}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-dark);font-weight:700;margin-bottom:18px;}
  .hero h1{font-size:clamp(30px,7vw,46px);line-height:1.08;max-width:520px;margin:0 auto 14px;}
  .hero p.lead{max-width:440px;margin:0 auto 30px;font-size:16px;}
  .hero-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
  .wave-divider{display:block;width:100%;height:60px;margin-top:-2px;}
  .quicklinks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:640px;margin:34px auto 0;}
  .quicklink{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 8px 16px;text-align:center;cursor:pointer;transition:transform .15s, box-shadow .15s;}
  .quicklink:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm);}
  .quicklink .ic-wrap{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 9px;box-shadow:0 4px 12px -4px rgba(34,51,42,0.25);}
  .quicklink .ic-wrap svg{width:22px;height:22px;}
  .quicklink .ic-cal{background:linear-gradient(135deg,var(--sage),var(--primary));}
  .quicklink .ic-sparkle{background:linear-gradient(135deg,#D98499,var(--accent-dark));}
  .quicklink .ic-search{background:linear-gradient(135deg,#C79A4A,var(--gold));}
  .quicklink .ic-chat{background:linear-gradient(135deg,#6B3FD1,#8F2FA8);}
  .quicklink .lb{font-size:11.5px;font-weight:600;color:var(--ink-soft);}
  @media(max-width:560px){.quicklinks{grid-template-columns:repeat(2,1fr);}}

  /* ---- Sections ---- */
  section.block{padding:44px 20px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;gap:10px;flex-wrap:wrap;}
  .section-head .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage);font-weight:700;display:block;margin-bottom:4px;}

  /* ---- Cards ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:620px){.grid-2{grid-template-columns:1fr;}}

  .service-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .15s, transform .15s;}
  .service-card:hover{box-shadow:var(--shadow-sm);transform:translateY(-2px);}
  .service-media{height:190px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(135deg,var(--surface-tint),var(--accent-soft));}
  .service-media img{width:100%;height:100%;object-fit:contain;}
  .svc-media-fallback{font-family:'Fraunces',serif;font-weight:600;font-size:32px;color:var(--primary);width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .svc-thumb{width:34px;height:34px;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,var(--surface-tint),var(--accent-soft));}
  .svc-thumb img{width:100%;height:100%;object-fit:cover;}
  .svc-thumb .svc-media-fallback{font-size:15px;}
  .svc-photo-preview{width:100%;height:180px;border-radius:12px;overflow:hidden;background:var(--surface-tint);display:flex;align-items:center;justify-content:center;margin-top:6px;}
  .svc-photo-preview img{width:100%;height:100%;object-fit:contain;}
  .service-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .service-cat{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dark);font-weight:700;}
  .service-name{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--primary-dark);}
  .service-desc{font-size:13px;color:var(--ink-soft);flex:1;}
  .service-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:10px;}
  .service-price{font-family:'Fraunces',serif;font-weight:600;color:var(--primary);font-size:16px;}
  .cat-filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;}
  .cat-chip{flex:0 0 auto;padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;white-space:nowrap;}
  .cat-chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .services-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:600px){.services-grid{grid-template-columns:1fr;}}

  .promo-strip{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;}
  .promo-card{flex:0 0 260px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:var(--radius);padding:20px;}
  .promo-card h4{color:#fff;font-size:16px;}
  .promo-card p{color:#DCE6DF;font-size:13px;margin:0;}

  /* ---- Petal stepper (signature element) ---- */
  .petal-steps{display:flex;justify-content:center;gap:6px;margin:18px 0 26px;}
  .petal{width:34px;height:20px;border-radius:14px;background:var(--line);position:relative;transition:all .25s ease;}
  .petal.active{background:var(--accent);width:44px;}
  .petal.done{background:var(--sage);}

  /* ---- Booking flow ---- */
  .step-title{text-align:center;margin-bottom:6px;}
  .step-sub{text-align:center;font-size:13.5px;margin-bottom:22px;}
  .svc-select-row{display:flex;align-items:center;gap:14px;padding:14px;border:1.5px solid var(--line);border-radius:var(--radius-sm);margin-bottom:10px;cursor:pointer;background:var(--surface);}
  .svc-select-row.checked{border-color:var(--accent);background:var(--accent-soft);}
  .svc-select-row .chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--sage);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
  .svc-select-row.checked .chk{background:var(--accent);border-color:var(--accent);}
  .svc-select-row .info{flex:1;}
  .svc-select-row .info b{font-family:'Fraunces',serif;color:var(--primary-dark);font-size:15px;}
  .svc-select-row .info span{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .svc-select-row .p{font-weight:700;color:var(--primary);font-family:'Fraunces',serif;}

  .summary-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 -8px 20px -14px rgba(0,0,0,0.2);}
  .summary-bar .tot{font-family:'Fraunces',serif;font-size:18px;color:var(--primary-dark);}
  .summary-bar .tot small{display:block;font-family:'Outfit',sans-serif;font-size:11px;color:var(--ink-soft);font-weight:600;}

  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-nav button{background:var(--surface-tint);border:none;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px;color:var(--primary);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);padding-bottom:4px;}
  .cal-day{aspect-ratio:1;border-radius:12px;border:1.5px solid transparent;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:13.5px;cursor:pointer;color:var(--ink);}
  .cal-day.empty{visibility:hidden;}
  .cal-day.disabled{color:#C9C3B4;cursor:not-allowed;background:var(--bg);}
  .cal-day.selected{background:var(--primary);color:#fff;font-weight:700;}
  .cal-day.today{border-color:var(--accent);}

  .slots-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  @media(max-width:480px){.slots-grid{grid-template-columns:repeat(2,1fr);}}
  .slot-btn{padding:12px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink);}
  .slot-btn.selected{background:var(--accent);border-color:var(--accent);color:#fff;}
  .slot-empty{grid-column:1/-1;text-align:center;color:var(--ink-soft);font-size:13.5px;padding:24px 0;}

  .form-field{margin-bottom:16px;}
  .form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
  .form-field input, .form-field select, .form-field textarea{
    width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);font-family:'Outfit',sans-serif;font-size:14.5px;background:var(--surface);color:var(--ink);
  }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus{outline:2px solid var(--sage);border-color:var(--sage);}
  .form-field textarea{resize:vertical;min-height:70px;}
  .checkbox-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--ink-soft);margin:16px 0;}
  .checkbox-row input{margin-top:3px;}
  .error-text{color:var(--danger);font-size:12.5px;margin-top:4px;}

  .summary-list{border:1px dashed var(--line);border-radius:var(--radius-sm);padding:14px;margin-bottom:16px;}
  .summary-list .row{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;}
  .summary-list .row.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-family:'Fraunces',serif;font-size:16px;color:var(--primary-dark);}

  .step-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;}

  /* ---- Confirmation ---- */
  .confirm-wrap{text-align:center;padding:40px 20px 20px;}
  .confirm-icon{width:70px;height:70px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px;}
  .code-box{display:inline-block;background:var(--surface-tint);border:1.5px dashed var(--sage);border-radius:12px;padding:12px 24px;font-family:'Fraunces',serif;font-size:22px;letter-spacing:.12em;font-weight:700;color:var(--primary-dark);margin:12px 0;}

  /* ---- Mi cita ---- */
  .lookup-box{max-width:420px;margin:0 auto;}
  .appt-card{border:1.5px solid var(--line);border-radius:var(--radius);padding:20px;background:var(--surface);}
  .status-pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .status-pendiente{background:#FBEBC7;color:#8A6412;}
  .status-pendiente_pago{background:#FBEBC7;color:#8A6412;}
  .status-confirmada{background:#DCEBDF;color:#2C5A3B;}
  .status-reprogramada{background:#DDE7F7;color:#2D4C86;}
  .status-cancelada_cliente{background:#F5DADA;color:#8A2E2E;}
  .status-cancelada_salon{background:#F5DADA;color:#8A2E2E;}
  .status-completada{background:#E4E4E4;color:#484848;}
  .status-no_asistio{background:#F0E0E0;color:#7A3A3A;}

  /* ---- WhatsApp float ---- */
  .wa-float{position:fixed;right:18px;bottom:18px;z-index:60;width:58px;height:58px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,0.25);cursor:pointer;border:none;}
  .pwa-install-btn{position:fixed;left:18px;bottom:18px;z-index:60;padding:11px 16px;border-radius:999px;background:var(--primary,#2E4A38);color:#fff;border:none;font-family:'Outfit',sans-serif;font-weight:600;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,0.25);cursor:pointer;}
  @media(max-width:480px){ .pwa-install-btn{font-size:12px;padding:9px 13px;} }
  .wa-float svg{width:28px;height:28px;}

  /* ---- Toast ---- */
  #toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,380px);}
  .toast{background:var(--primary-dark);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow);animation:toastIn .25s ease;}
  .toast.err{background:var(--danger);}
  @keyframes toastIn{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  /* ---- Admin ---- */
  .admin-shell{display:flex;min-height:100vh;max-width:none;margin:0;}
  .admin-side{width:220px;flex:0 0 220px;background:var(--primary-dark);color:#EDEFE9;padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .admin-side .brand-name{color:#fff;}
  .admin-side nav{margin-top:24px;display:flex;flex-direction:column;gap:4px;}
  .admin-side nav button{text-align:left;background:none;border:none;color:#C9D6CC;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;}
  .admin-side nav button.active{background:rgba(255,255,255,0.12);color:#fff;}
  .admin-side nav button:hover{color:#fff;}
  .admin-main{flex:1;padding:26px 30px;max-width:1100px;}
  @media(max-width:840px){
    .admin-shell{flex-direction:column;}
    .admin-side{width:100%;flex:none;height:auto;position:relative;padding:16px;}
    .admin-side nav{flex-direction:row;overflow-x:auto;margin-top:14px;}
    .admin-side nav button{white-space:nowrap;}
    .admin-main{padding:20px 16px;}
  }
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
  @media(max-width:760px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:16px;}
  .stat-card .n{font-family:'Fraunces',serif;font-size:26px;color:var(--primary-dark);font-weight:600;}
  .stat-card .l{font-size:12px;color:var(--ink-soft);font-weight:600;}
  table.dtable{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.dtable th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);padding:8px 10px;border-bottom:2px solid var(--line);}
  table.dtable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.dtable tr:hover td{background:var(--surface-tint);}
  .badge-count{background:var(--accent);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 7px;margin-left:auto;}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-row select, .filter-row input{padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);font-size:13px;font-family:inherit;}
  .modal-bg{position:fixed;inset:0;background:rgba(34,51,42,0.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;}
  .modal{background:var(--surface);border-radius:var(--radius);padding:24px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;}
  .day-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .day-row .dname{width:90px;font-weight:600;font-size:13.5px;}
  .toggle{position:relative;width:40px;height:22px;border-radius:999px;background:var(--line);cursor:pointer;flex:0 0 auto;}
  .toggle.on{background:var(--primary);}
  .toggle .dot{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;}
  .toggle.on .dot{left:20px;}
  .small-time{padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);font-size:12.5px;width:88px;}
  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .alert-item{display:flex;gap:10px;padding:12px;border-radius:12px;border:1px solid var(--line);margin-bottom:8px;background:var(--surface);}
  .alert-item .dot2{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:0 0 auto;}
  .alert-item.read{opacity:.55;}
  footer.site-footer{padding:34px 20px 60px;text-align:center;color:var(--ink-soft);font-size:12.5px;border-top:1px solid var(--line);margin-top:20px;}
  .pill-row{display:flex;gap:6px;flex-wrap:wrap;}
  .k-pill{font-size:11px;background:var(--surface-tint);border-radius:999px;padding:3px 10px;color:var(--ink-soft);font-weight:600;}

  .login-wrap{max-width:380px;margin:70px auto;padding:30px;}
  .divider{height:1px;background:var(--line);margin:20px 0;}
  .helper-text{font-size:12px;color:var(--ink-soft);margin-top:-8px;margin-bottom:14px;}

  }

  .biz-identity{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:16px;}
  .biz-logo{width:108px;height:108px;border-radius:28px;overflow:hidden;background:var(--surface);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:52px;box-shadow:var(--shadow-sm);}
  .biz-logo img{width:100%;height:100%;object-fit:cover;}
  .biz-logo-fallback{font-family:'Fraunces',serif;font-weight:600;font-size:44px;color:var(--primary);background:linear-gradient(135deg,var(--surface-tint),var(--accent-soft));width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .biz-name{font-family:'Fraunces',serif;font-weight:600;font-size:15px;color:var(--ink-soft);letter-spacing:.02em;}
  .hero-photo{max-width:560px;margin:26px auto 0;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  .hero-photo img{width:100%;display:block;}
  .logo-preview{width:104px;height:104px;border-radius:26px;border:1.5px solid var(--line);background:var(--surface-tint);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden;margin-top:8px;}

/* ---------- Storage helpers (Firebase Firestore, multi-tenant) ---------- */
async function loadKey(key, fallback, tenantId){
  const tid = tenantId || STATE.tenantId;
  if(!db || !tid) return fallback;
  try{
    const snap = await db.collection('tenants').doc(tid).collection('data').doc(key).get();
    if(snap.exists && snap.data().json){ return JSON.parse(snap.data().json); }
    return fallback;
  }catch(e){
    console.error('firebase load error', key, e);
    return fallback;
  }
}
async function saveKey(key, value, tenantId){
  const tid = tenantId || STATE.tenantId;
  if(!db || !tid) return false;
  try{
    await db.collection('tenants').doc(tid).collection('data').doc(key).set({
      json: JSON.stringify(value),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return true;
  }catch(e){
    console.error('firebase save error', key, e);
    toast('No se pudo guardar en la nube. Revisa tu conexión.', true);
    return false;
  }
}

/* ---------- Licencias / multi-negocio ---------- */
function newTenantId(){ return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function redeemLicense(code, businessName, email, password){
  if(!db || !auth) return {ok:false, error:'La app no está conectada a Firebase.'};
  code = (code||'').trim().toUpperCase();
  businessName = (businessName||'').trim();
  if(!code) return {ok:false, error:'Ingresa el código de licencia.'};
  if(!businessName) return {ok:false, error:'Ingresa el nombre de tu negocio.'};
  if(!email || !password || password.length<6) return {ok:false, error:'Correo válido y contraseña de al menos 6 caracteres.'};

  const licRef = db.collection('licenses').doc(code);
  try{
    const licSnap = await licRef.get();
    if(!licSnap.exists) return {ok:false, error:`Código de licencia no válido. [diag: busqué "${code}" (${code.length} caracteres) en el proyecto "${firebaseConfig.projectId}"]`};
    if(licSnap.data().used) return {ok:false, error:'Este código ya fue utilizado.'};

    const cred = await auth.createUserWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    const tenantId = newTenantId();

    await db.collection('tenants').doc(tenantId).set({
      businessName, ownerUid:uid, ownerEmail:email, licenseCode:code,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('users').doc(uid).set({ tenantId, email });
    await licRef.set({ used:true, tenantId, ownerUid:uid, usedAt: firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});

    STATE.tenantId = tenantId;
    const cfg = defaultConfig();
    cfg.name = businessName;
    await saveKey('config', cfg, tenantId);
    await saveKey('services', defaultServices(), tenantId);

    return {ok:true, tenantId};
  }catch(e){
    console.error('redeemLicense error', e);
    let msg = 'No se pudo activar la licencia.';
    if(e.code==='auth/email-already-in-use') msg = 'Ese correo ya tiene una cuenta. Inicia sesión en vez de activar de nuevo.';
    else msg += ` [diag: ${e.code||''} ${e.message||e}]`;
    return {ok:false, error:msg};
  }
}

/* ---------- Notificaciones: en pestaña abierta (Notification API) + push real (FCM) ---------- */
let _knownAlertIds = null; // null = todavía no inicializado con la primera carga

function notifyNewAlerts(incomingAlerts){
  if(_knownAlertIds === null){
    // Primera carga: solo memorizamos lo que ya existía, sin notificar (evita
    // "spam" de notificaciones viejas al abrir la app).
    _knownAlertIds = new Set(incomingAlerts.map(a=>a.id));
    return;
  }
  if(typeof Notification === 'undefined' || Notification.permission !== 'granted') {
    _knownAlertIds = new Set(incomingAlerts.map(a=>a.id));
    return;
  }
  const fresh = incomingAlerts.filter(a=>!_knownAlertIds.has(a.id));
  fresh.forEach(al=>{
    try{
      const title = al.type==='nueva_reserva' ? '🔔 Nueva cita reservada' : '💬 Nueva solicitud';
      new Notification(title, { body: al.message, icon: APP_LOGO, tag: al.id });
    }catch(e){ /* algunos navegadores/contextos bloquean new Notification(); se ignora */ }
  });
  _knownAlertIds = new Set(incomingAlerts.map(a=>a.id));
}

function notificationButtonLabel(){
  if(typeof Notification === 'undefined') return '';
  if(Notification.permission === 'granted') return '';
  if(Notification.permission === 'denied') return '🔕 Notificaciones bloqueadas';
  return '🔔 Activar notificaciones';
}

// Registra este dispositivo/navegador para recibir push reales (celular bloqueado o
// app cerrada). Pide permiso, registra el service worker, obtiene el token FCM y lo
// guarda en Firestore junto al negocio, para que la función del servidor sepa a qué
// dispositivos avisar.
async function enablePushNotifications(){
  if(typeof Notification === 'undefined'){
    alert('Tu navegador no soporta notificaciones.');
    return false;
  }
  if(Notification.permission === 'denied'){
    alert('Bloqueaste las notificaciones para este sitio. Para activarlas, entra a la configuración del navegador (ícono de candado junto a la URL) y permite "Notificaciones".');
    return false;
  }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted') return false;

  if(!messaging || !('serviceWorker' in navigator)){
    // El navegador soporta notificaciones locales pero no push en segundo plano.
    toast('Notificaciones activadas en esta pestaña 🔔');
    return true;
  }
  try{
    const reg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
    const token = await messaging.getToken({ vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: reg });
    if(token) await savePushToken(token);
    toast('Notificaciones push activadas 🔔 (llegan aunque cierres la app)');
    return true;
  }catch(e){
    console.error('FCM token error', e);
    toast('Se activaron las notificaciones en esta pestaña, pero el push en segundo plano no pudo configurarse.', true);
    return true;
  }
}

async function savePushToken(token){
  if(!db || !STATE.tenantId) return;
  const tokens = await loadKey('pushTokens', []);
  if(!tokens.includes(token)){
    tokens.push(token);
    await saveKey('pushTokens', tokens);
  }
}

/* ---------- PWA: manifiesto dinámico + instalación ---------- */
// Chrome exige que las dimensiones REALES del ícono coincidan con el tamaño declarado
// en "sizes" (192x192 / 512x512). Si no coinciden, descarta el ícono y la app deja de
// ser "instalable" (no dispara beforeinstallprompt). Por eso medimos la imagen real
// antes de armar el manifest, en vez de asumir que ya tiene el tamaño correcto.
function getImageDimensions(src){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=> resolve({w: img.naturalWidth, h: img.naturalHeight});
    img.onerror = ()=> resolve(null);
    img.src = src;
  });
}

async function updateManifest(){
  let name, icon, iconLarge, startUrl, themeColor;
  const inTenantPublicView = STATE.tenantId && STATE.config && !['admin','landing','license'].includes(STATE.view);
  const customLogo = STATE.config && STATE.config.logo && (STATE.config.logo.startsWith('http')||STATE.config.logo.startsWith('data:'));

  if(inTenantPublicView){
    name = STATE.config.name || APP_NAME;
    icon = customLogo ? STATE.config.logo : APP_LOGO;
    iconLarge = customLogo ? STATE.config.logo : APP_LOGO_512;
    startUrl = location.pathname + '#t/' + STATE.tenantId;
    themeColor = (STATE.config.theme && STATE.config.theme.primary) || '#2E4A38';
  } else {
    name = APP_NAME;
    icon = APP_LOGO;
    iconLarge = APP_LOGO_512;
    startUrl = location.pathname + (STATE.tenantId ? ('#t/'+STATE.tenantId) : '#admin');
    themeColor = '#2E4A38';
  }

  // Medir los íconos reales y declarar su tamaño verdadero, en vez de forzar las
  // etiquetas "192x192" / "512x512" a ciegas (eso rompía la instalabilidad en Chrome).
  const [smallDims, largeDims] = await Promise.all([getImageDimensions(icon), getImageDimensions(iconLarge)]);
  const smallSize = smallDims ? `${smallDims.w}x${smallDims.h}` : '192x192';
  const largeSize = largeDims ? `${largeDims.w}x${largeDims.h}` : '512x512';

  const manifest = {
    name: name,
    short_name: name.slice(0,15),
    start_url: startUrl,
    scope: location.pathname,
    display: 'standalone',
    background_color: '#EDE7D5',
    theme_color: themeColor,
    icons: [
      { src: icon, sizes: smallSize, type: 'image/png', purpose: 'any maskable' },
      { src: iconLarge, sizes: largeSize, type: 'image/png', purpose: 'any maskable' }
    ]
  };

  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const link = document.getElementById('manifest-link');
  if(link){
    if(link.dataset.blobUrl) URL.revokeObjectURL(link.dataset.blobUrl);
    link.href = url;
    link.dataset.blobUrl = url;
  }
  const appleIcon = document.getElementById('apple-touch-icon-link');
  if(appleIcon) appleIcon.href = icon;
  const favicon = document.getElementById('favicon-link');
  if(favicon) favicon.href = icon;
  document.title = name + (inTenantPublicView ? ' — Reserva tu cita' : '');
}

let deferredInstallPrompt = null;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone = (typeof window.matchMedia === 'function' && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;

// El navegador solo sabe "estoy corriendo en modo standalone" cuando abrís la app YA
// instalada. Si el admin abre una pestaña normal del navegador después de instalar,
// isStandalone da false y no hay forma nativa de preguntar "¿ya está instalada?".
// Por eso guardamos una bandera propia en localStorage la primera vez que se instala,
// para poder ocultar el botón "Instalar esta app" en este dispositivo de ahí en más.
const PWA_INSTALLED_KEY = 'bookspa_pwa_installed';
function isPwaInstalled(){
  return isStandalone || (typeof localStorage !== 'undefined' && localStorage.getItem(PWA_INSTALLED_KEY) === '1');
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallButton();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  try{ localStorage.setItem(PWA_INSTALLED_KEY, '1'); }catch(e){}
  hideInstallButton();
  render(); // refresca el sidebar del admin para que el botón desaparezca ya mismo
});

function showInstallButton(){
  if(isPwaInstalled() || STATE.view==='admin') return;
  let btn = document.getElementById('pwa-install-btn');
  if(btn) return;
  btn = document.createElement('button');
  btn.id = 'pwa-install-btn';
  btn.className = 'pwa-install-btn';
  btn.innerHTML = '📲 Instalar app';
  btn.addEventListener('click', async ()=>{
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      hideInstallButton();
    } else if(isIOS){
      alert('Para instalar: toca el ícono de compartir (⬆️) en Safari y selecciona "Agregar a inicio".');
    }
  });
  document.body.appendChild(btn);
}
function hideInstallButton(){
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.remove();

/* ---------- Availability engine ---------- */
function activeAppointmentsForDate(iso, excludeId){
  const now = Date.now();
  return STATE.appointments.filter(a=>{
    if(a.id===excludeId) return false;
    if(a.date!==iso) return false;
    if(a.status==='hold' && a.holdExpiresAt && a.holdExpiresAt < now) return false;
    if(['cancelada_cliente','cancelada_salon','no_asistio'].includes(a.status)) return false;
    return true;
  });
}

function blockedRangesFor(iso){
  return STATE.config.blockedDates.filter(b=>b.date===iso);
}

function isDayOpen(iso){
  const d = parseISODate(iso);
  const dow = dowKeyFromDate(d);
  const h = STATE.config.hours[dow];
  if(!h || !h.open) return false;
  const fullDayBlocked = blockedRangesFor(iso).some(b=>b.allDay);
  if(fullDayBlocked) return false;
  return true;
}

function computeSlots(iso, totalDurationMin){
  if(!isDayOpen(iso)) return [];
  const d = parseISODate(iso);
  const dow = dowKeyFromDate(d);
  const h = STATE.config.hours[dow];
  const openMin = timeToMin(h.start), closeMin = timeToMin(h.end);
  const interval = STATE.config.slotIntervalMinutes || 30;
  const buffer = STATE.config.bufferMinutes || 0;
  const maxSim = STATE.config.maxSimultaneous || 1;
  const dayBreaks = STATE.config.breaks.filter(b=>b.day===dow);
  const partialBlocks = blockedRangesFor(iso).filter(b=>!b.allDay && b.startTime && b.endTime);
  const existing = activeAppointmentsForDate(iso);

  const now = new Date();
  const isToday = iso === toISODate(now);
  const nowMin = now.getHours()*60+now.getMinutes();

  const slots = [];
  for(let start=openMin; start+totalDurationMin<=closeMin; start+=interval){
    const end = start+totalDurationMin;
    if(isToday && start <= nowMin+10) continue; // small buffer for "now"

    const overlapsBreak = dayBreaks.some(b=>{
      const bs=timeToMin(b.start), be=timeToMin(b.end);
      return start < be && end > bs;
    });
    if(overlapsBreak) continue;

    const overlapsBlock = partialBlocks.some(b=>{
      const bs=timeToMin(b.startTime), be=timeToMin(b.endTime);
      return start < be && end > bs;
    });
    if(overlapsBlock) continue;

    const overlapCount = existing.filter(a=>{
      const as = timeToMin(a.time);
      const ae = as + a.totalDuration + buffer;
      return start < ae && (end+buffer) > as;
    }).length;
    if(overlapCount >= maxSim) continue;

    slots.push(minToTime(start));
  }
  return slots;
}

function cleanExpiredHolds(){
  const now = Date.now();
  let changed = false;
  STATE.appointments = STATE.appointments.filter(a=>{
    if(a.status==='hold' && a.holdExpiresAt && a.holdExpiresAt < now){ changed = true; return false; }
    return true;
  });
  if(changed) persistAppointments();
}

/* ---------- Init ---------- */
function parseRoute(){
  const h = location.hash;
  if(h.startsWith('#t/')){
    const rest = h.slice(3);
    const parts = rest.split('/');
    const tenantId = parts[0];
    if(parts[1]==='cita' && parts[2]) return {view:'micita', tenantId, pid:parts[2]};
    return {view:'home', tenantId};
  }
  if(h==='#admin') return {view:'admin'};
  if(h==='#activar') return {view:'license'};
  return {view:'landing'};
}

async function loadTenantData(){
  const [cfg, svc, appts, alerts] = await Promise.all([
    loadKey('config', null),
    loadKey('services', null),
    loadKey('appointments', null),

  ]);
  STATE.config = cfg || defaultConfig();
  if(!STATE.config.theme) STATE.config.theme = defaultTheme();
  STATE.services = svc || defaultServices();
  STATE.appointments = appts || [];
  STATE.alerts = alerts || [];
  cleanExpiredHolds();
  applyTheme();
  startRealtimeSync();
}

async function enterAdminSession(uid){
  const tenantId = await resolveTenantForUser(uid);
  if(!tenantId){
    toast('Tu cuenta no está vinculada a ningún negocio.', true);
    await auth.signOut();
    STATE.admin.loggedIn = false;
    STATE.loading = false;
    render();
    return;
  }
  STATE.tenantId = tenantId;
  try{
    await withTimeout(loadTenantData(), 10000);
  }catch(e){
    console.error('load tenant data timeout/error (admin)', e);

    return;
  }
  STATE.admin.loggedIn = true;
  STATE.admin.tab = 'resumen';
  STATE.view = 'admin';
  STATE.loading = false;
  render();
}

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject)=> setTimeout(()=> reject(new Error('timeout')), ms))
  ]);
}

async function init(){
  if(!FIREBASE_CONFIGURED){
    document.getElementById('app').innerHTML = `
      <div style="max-width:520px;margin:60px auto;padding:24px;text-align:center;font-family:'Outfit',sans-serif;">
        <h2 style="font-family:'Fraunces',serif;color:#8C3A4A;">Falta conectar Firebase</h2>
        <p style="color:#3E4C42;">Esta app necesita tu configuración de Firebase para guardar y sincronizar las citas. Pega tus datos en la constante <code>firebaseConfig</code> al inicio del archivo (busca "PEGA_TU_" para ubicarla) y vuelve a abrir la app.</p>
      </div>`;
    return;
  }

  const route = parseRoute();
  updateManifest();

  if(route.view==='admin'){
    STATE.view = 'admin';
    let initialCheckDone = false;
    const safetyTimer = setTimeout(()=>{
      if(!initialCheckDone){
        initialCheckDone = true;
        STATE.admin.loggedIn = false;
        STATE.loading = false;
        render();
        toast('No se pudo verificar tu sesión. Inicia sesión de nuevo.', true);
      }
    }, 6000);
    auth.onAuthStateChanged(async user=>{
      clearTimeout(safetyTimer);
      initialCheckDone = true;
      if(user){
        await enterAdminSession(user.uid);
      } else {
        STATE.admin.loggedIn = false;
        STATE.loading = false;
        render();
      }
    });
    return;
  }

  if(route.view==='license'){
    STATE.view = 'license';
    STATE.loading = false;
    render();
    return;
  }

  if(route.tenantId){
    STATE.tenantId = route.tenantId;
    try{
      await withTimeout(loadTenantData(), 10000);
    }catch(e){
      console.error('load tenant data timeout/error', e);
      showLoadError();
      return;
    }
    if(route.view==='micita'){
      STATE.miCita.privateId = route.pid;
      STATE.miCita.found = STATE.appointments.find(a=>a.privateId===route.pid) || null;
      STATE.view = 'micita';
    } else {
      STATE.view = 'home';
    }
    window.addEventListener('hashchange', ()=>{
      const r2 = parseRoute();
      if(r2.view==='micita' && r2.tenantId===STATE.tenantId){
        STATE.miCita.privateId = r2.pid;
        STATE.miCita.found = STATE.appointments.find(a=>a.privateId===r2.pid) || null;
        STATE.view = 'micita';
        render();
      }
    });
    STATE.loading = false;
    render();
    return;
  }

  // Sin negocio ni ruta de admin: pantalla neutral
  STATE.view = 'landing';
  STATE.loading = false;
  render();
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ reject(new Error('not an image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read error'));
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('image error'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- BOOKING FLOW ---------- */
function totalForSelection(){
  const sel = STATE.booking.selected.map(id=>serviceById(id)).filter(Boolean);
  const duration = sel.reduce((a,s)=>a + (s.duration!=null && s.duration!=='' ? Number(s.duration) : DEFAULT_DURATION_FALLBACK), 0);
  const price = sel.reduce((a,s)=>a + (s.price!=null && s.price!=='' ? Number(s.price) : 0), 0);
  const hasQuote = sel.some(s=>s.price===null||s.price===undefined||s.price==='');
  const hasEstimatedDuration = sel.some(s=>s.duration===null||s.duration===undefined||s.duration==='');
  return {sel, duration, price, hasQuote, hasEstimatedDuration};
}

function renderBooking(){
  const {step} = STATE.booking;
  return `
    <section class="block" style="padding-top:26px;">
      <div class="petal-steps">

      ${step===2?bookingStep2():''}

function bookingStep1(){
  const {sel, duration, price, hasQuote} = totalForSelection();
  return `
    <h2 class="step-title">Elige tus servicios</h2>

      <button class="btn btn-primary" data-action="booking-next" ${sel.length===0?'disabled':''}>Continuar</button>
    </div>
  `;
}

function bookingStep2(){
  const {duration} = totalForSelection();
  const offset = STATE.booking.calMonthOffset||0;
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+offset);
  const year = base.getFullYear(), month = base.getMonth();
  const firstDow = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const maxDate = new Date(); maxDate.setDate(maxDate.getDate()+ (STATE.config.advanceBookingDays||30));

  let cells = '';
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateObj = new Date(year,month,d);
    const iso = toISODate(dateObj);
    const isPast = dateObj < today;
    const tooFar = dateObj > maxDate;
    const open = isDayOpen(iso);
    const disabled = isPast || tooFar || !open;
    const isToday = toISODate(today)===iso;
    const selected = STATE.booking.date===iso;
    cells += `<div class="cal-day ${disabled?'disabled':''} ${isToday?'today':''} ${selected?'selected':''}" ${disabled?'':`data-action="pick-date" data-date="${iso}"`}>${d}</div>`;
  }

  const slots = STATE.booking.date ? computeSlots(STATE.booking.date, duration) : [];

  return `
    <h2 class="step-title">Elige día y hora</h2>
    <p class="step-sub">Duración total: ${duration} min</p>
    <div class="card" style="margin-bottom:18px;">
      <div class="cal-nav">
        <button data-action="cal-prev">←</button>
        <div style="font-family:'Fraunces',serif;font-weight:600;">${MONTHS_ES[month]} ${year}</div>
        <button data-action="cal-next">→</button>
      </div>
      <div class="cal-grid">
        ${['D','L','M','M','J','V','S'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    ${STATE.booking.date ? `
      <h3 style="font-size:15px;">Horarios disponibles — ${fmtDateLong(STATE.booking.date)}</h3>
      <div class="slots-grid">
        ${slots.length? slots.map(t=>`<button class="slot-btn ${STATE.booking.time===t?'selected':''}" data-action="pick-time" data-time="${t}">${t}</button>`).join('') : '<div class="slot-empty">No hay horarios disponibles este día. Prueba otra fecha 🌿</div>'}
      </div>
    ` : `<p style="text-align:center;color:var(--ink-soft);font-size:13.5px;">Selecciona un día para ver los horarios disponibles.</p>`}
    <div class="step-nav">
      <button class="btn btn-ghost" data-action="booking-back">Atrás</button>
      <button class="btn btn-primary" data-action="booking-next" ${(!STATE.booking.date||!STATE.booking.time)?'disabled':''}>Continuar</button>
    </div>
  `;
}

function buildICS(a){
  const d = parseISODate(a.date);
  const [h,m] = a.time.split(':').map(Number);
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m);
  const end = new Date(start.getTime() + a.totalDuration*60000);
  const fmt = (dt)=>dt.getFullYear()+pad2(dt.getMonth()+1)+pad2(dt.getDate())+'T'+pad2(dt.getHours())+pad2(dt.getMinutes())+'00';
  const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:Cita ${STATE.config.name}\nDESCRIPTION:${a.services.map(s=>s.name).join(', ')}\nLOCATION:${STATE.config.address}\nDTSTART:${fmt(start)}\nDTEND:${fmt(end)}\nEND:VEVENT\nEND:VCALENDAR`;
  return 'data:text/calendar;charset=utf8,'+encodeURIComponent(ics);
}

function statusLabel(s){
  return {
    pendiente:'Pendiente', pendiente_pago:'Pendiente de pago', confirmada:'Confirmada',
    reprogramada:'Reprogramada', cancelada_cliente:'Cancelada por la clienta',
    cancelada_salon:'Cancelada por el salón', completada:'Completada', no_asistio:'No asistió'
  }[s] || s;
}

function canCancel(a){
  const now = new Date();
  const d = parseISODate(a.date);
  const [h,m] = a.time.split(':').map(Number);
  const apptDate = new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);
  const diffHours = (apptDate - now)/3600000;
  return diffHours >= (STATE.config.minCancelHours||0);
}

/* =========================================================
   EVENT HANDLING
========================================================= */
function attachHandlers(){
  const app = document.getElementById('app');
  app.onclick = onAppClick;
  app.oninput = onAppInput;
}

function onAppInput(e){
  const t = e.target;
  if(t.id==='mc-password') STATE.miCita.password = t.value;
  if(t.id==='mc-phone') STATE.miCita.phone = t.value;
  if(t.id==='f-name') STATE.booking.name = t.value;
  if(t.id==='f-phone') STATE.booking.phone = t.value;
  if(t.id==='f-password') STATE.booking.password = t.value;
  if(t.id==='f-email') STATE.booking.email = t.value;
  if(t.id==='f-note') STATE.booking.note = t.value;
  if(t.id==='f-accept') STATE.booking.accepted = t.checked;

  // admin dynamic inputs handled generically via data-bind on blur/change instead
}

async function onAppClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'go': {
      const v = el.dataset.view;
      if(v==='booking-start'){
        STATE.booking = { step:1, selected:[], date:null, time:null, holdId:null, name:STATE.booking.name||'', phone:STATE.booking.phone||'', email:'', password:STATE.booking.password||'', note:'', accepted:false, calMonthOffset:0 };
        STATE.view='booking';
      } else if(v==='admin'){
        STATE.view='admin';
      } else if(v==='admin-login'){
        STATE.view='admin';
      } else {
        STATE.view = v;
      }
      window.scrollTo(0,0);
      render();
      break;
    }
    case 'go-private': {
      location.hash = '#t/'+STATE.tenantId+'/cita/'+el.dataset.pid;
      break;
    }
    case 'go-license': {
      STATE.view = 'license';
      STATE.license = { code:'', businessName:'', email:'', password:'', error:'' };
      render();
      break;
    }
    case 'enable-notifications': {
      await enablePushNotifications();
      render();
      break;
    }
    case 'pwa-install': {
      if(deferredInstallPrompt){
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
      } else if(isIOS){
        alert('Para instalar: toca el ícono de compartir (⬆️) en Safari y selecciona "Agregar a inicio".');
      } else if(isPwaInstalled()){
        toast('Ya tienes esta app instalada 🎉');
      } else {
        alert('Tu navegador aún no ofreció instalar la app automáticamente. Busca el ícono de instalar (⊕ o una pantalla con flecha) en la barra de direcciones, o el menú (⋮) → "Instalar app" / "Agregar a pantalla de inicio".');
      }
      break;
    }
    case 'go-landing': {
      STATE.view = 'landing';
      render();
      break;
    }
    case 'go-admin-login': {
      location.hash = '#admin';
      STATE.view = 'admin';
      render();
      break;
    }
    case 'license-submit': {
      const code = document.getElementById('lic-code').value;
      const businessName = document.getElementById('lic-business').value;
      const email = document.getElementById('lic-email').value.trim();
      const password = document.getElementById('lic-password').value;
      STATE.license.error = '';
      render();
      const btn = el; btn.disabled = true; btn.textContent = 'Activando…';
      const result = await redeemLicense(code, businessName, email, password);
      if(result.ok){
        location.hash = '#admin';
        await loadTenantData();
        STATE.admin.loggedIn = true;
        STATE.admin.tab = 'resumen';
        STATE.view = 'admin';
        toast('¡Listo! Tu negocio fue creado. Completa tu configuración.');
        render();
      } else {
        STATE.license.code = code;
        STATE.license.businessName = businessName;
        STATE.license.email = email;
        STATE.license.error = result.error;
        render();
      }
      break;
    }
    case 'book-service': {
      STATE.booking = { step:1, selected:[el.dataset.id], date:null, time:null, holdId:null, name:'', phone:'', email:'', password:'', note:'', accepted:false, calMonthOffset:0 };
      STATE.view='booking';
      window.scrollTo(0,0);
      render();
      break;
    }
    case 'filter-cat': STATE.serviceFilterCat = el.dataset.cat; render(); break;
    case 'toggle-service': {
      const id = el.dataset.id;
      const i = STATE.booking.selected.indexOf(id);
      if(i>=0) STATE.booking.selected.splice(i,1); else STATE.booking.selected.push(id);
      render();
      break;
    }
    case 'booking-next': {
      if(STATE.booking.step===1 && STATE.booking.selected.length===0) return;
      if(STATE.booking.step===2 && (!STATE.booking.date || !STATE.booking.time)) return;
      STATE.booking.step++;
      window.scrollTo(0,0);
      render();
      break;
    }
    case 'booking-back': {
      STATE.booking.step = Math.max(1, STATE.booking.step-1);
      window.scrollTo(0,0);
      render();
      break;
    }
    case 'cal-prev': STATE.booking.calMonthOffset = (STATE.booking.calMonthOffset||0)-1; render(); break;
    case 'cal-next': STATE.booking.calMonthOffset = (STATE.booking.calMonthOffset||0)+1; render(); break;
    case 'pick-date': STATE.booking.date = el.dataset.date; STATE.booking.time=null; render(); break;
    case 'pick-time': STATE.booking.time = el.dataset.time; render(); break;
    case 'booking-confirm': await confirmBooking(); break;
    case 'mc-lookup': await lookupAppointment(); break;
    case 'mc-cancel': await cancelAppointment(el.dataset.id); break;
    case 'wa-talk': openTalkFlow(); break;
    case 'talk-close': STATE.talkForm.open = false; render(); break;
    case 'talk-submit': {
      const name = document.getElementById('talk-name').value.trim();
      const phone = document.getElementById('talk-phone').value.trim();
      const motivo = document.getElementById('talk-motivo').value.trim();
      const errEl = document.getElementById('talk-error');
      if(!name || !phone){
        errEl.textContent = 'Por favor ingresa tu nombre y teléfono.';
        return;
      }
      const text = `Hola, soy ${name} (tel. ${phone}). Necesito comunicarme directamente con el salón.${motivo? ' Mi consulta: '+motivo : ''}`;
      window.open(waLink(STATE.config.whatsapp, text), '_blank');
      pushAlert('whatsapp_solicitud', `Nueva solicitud de contacto de ${name}`, {clientName:name, phone, motivo, status:'pendiente'});
      STATE.talkForm.open = false;
      toast('Abrimos WhatsApp para que puedas escribirnos 💬');
      render();
      break;
    }
    case 'wa-notify-salon': {
      const a = STATE.appointments.find(x=>x.id===el.dataset.id) || STATE.booking.lastAppointment;
      if(a) window.open(waLink(STATE.config.whatsapp, newApptNotifyMsg(a)), '_blank');
      break;
    }
    case 'wa-appt': {
      const a = STATE.appointments.find(x=>x.id===el.dataset.id) || STATE.booking.lastAppointment;
      const txt = a ? `Hola, soy ${a.clientName}. Tengo una cita el ${fmtDateShort(a.date)} a las ${a.time} (código de reserva ${a.code}) y necesito comunicarme con el salón.` : `Hola, necesito comunicarme con el salón.`;
      window.open(waLink(STATE.config.whatsapp, txt), '_blank');
      pushAlert('whatsapp_solicitud', `Solicitud de contacto${a? ' de '+a.clientName : ''}`, {clientName:a?a.clientName:'', phone:a?a.clientPhone:'', apptId:a?a.id:null, status:'pendiente'});
      break;
    }
    default:
      if(action.startsWith('admin-')) await handleAdminAction(action, el);
      break;
  }
}

async function confirmBooking(){
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const password = document.getElementById('f-password').value;
  const email = document.getElementById('f-email').value.trim();
  const note = document.getElementById('f-note').value.trim();
  const accepted = document.getElementById('f-accept').checked;
  const errBox = document.getElementById('form-error');

  if(!name || !phone || !password || !accepted){
    errBox.textContent = 'Completa nombre, WhatsApp, contraseña y acepta las políticas para continuar.';
    return;
  }
  if(password.length < 4){
    errBox.textContent = 'La contraseña debe tener al menos 4 caracteres.';
    return;
  }
  errBox.textContent='';

  cleanExpiredHolds();
  const {sel, duration, price} = totalForSelection();
  const freshSlots = computeSlots(STATE.booking.date, duration);
  if(!freshSlots.includes(STATE.booking.time)){
    errBox.textContent = 'Ese horario acaba de ocuparse. Por favor elige otro.';
    STATE.booking.step = 2;
    STATE.booking.time = null;
    render();
    return;
  }

  const appt = {
    id: uid('ap'),
    // Código público solo de referencia (no sirve para gestionar la cita; para eso se usa
    // el teléfono + la contraseña que eligió la clienta, que es información privada suya).
    code: uid('').slice(0,7).toUpperCase(),
    password: password,
    privateId: uid('pv')+uid('pv'),
    services: sel.map(s=>({id:s.id, name:s.name, price:s.price, duration:s.duration})),
    totalDuration: duration,
    totalPrice: price,
    date: STATE.booking.date,
    time: STATE.booking.time,
    clientName: name,
    clientPhone: phone,
    clientEmail: email,
    note: note,
    status: STATE.config.paymentsEnabled && STATE.config.depositType!=='none' ? 'pendiente_pago' : 'pendiente',
    paymentStatus: STATE.config.paymentsEnabled ? 'pendiente' : null,
    internalNotes:'',
    createdAt: Date.now(),
    cancelledAt:null
  };
  STATE.appointments.push(appt);
  await persistAppointments();
  pushAlert('nueva_reserva', `Nueva reserva de ${name} — ${fmtDateShort(appt.date)} ${appt.time}`, {apptId:appt.id});

  // Intento automático de notificar al salón por WhatsApp (puede ser bloqueado por el navegador;
  // por eso también se ofrece el botón manual en la pantalla de confirmación).
  if(STATE.config.whatsapp){
    try{ window.open(waLink(STATE.config.whatsapp, newApptNotifyMsg(appt)), '_blank'); }catch(e){}
  }

  STATE.booking.lastAppointment = appt;
  STATE.view = 'confirmation';
  window.scrollTo(0,0);
  render();
}

async function lookupAppointment(){
  const password = document.getElementById('mc-password').value;
  const phone = (document.getElementById('mc-phone').value||'').trim().replace(/[^0-9+]/g,'');
  const errBox = document.getElementById('mc-error');
  if(!password || !phone){ errBox.textContent='Ingresa tu número de WhatsApp y tu contraseña.'; return; }
  const matches = STATE.appointments.filter(a=> a.password===password && a.clientPhone.replace(/[^0-9+]/g,'')===phone );
  if(!matches.length){ errBox.textContent='No encontramos una cita con esos datos.'; return; }
  const found = matches.sort((a,b)=>b.createdAt-a.createdAt)[0];
  location.hash = '#t/'+STATE.tenantId+'/cita/'+found.privateId;
}


async function cancelAppointment(id){
  if(!confirm('¿Confirmas que deseas cancelar esta cita? Esta acción no se puede deshacer.')) return;
  const a = STATE.appointments.find(x=>x.id===id);
  if(!a) return;
  if(!canCancel(a)){ toast('Ya no es posible cancelar en línea.', true); return; }
  a.status='cancelada_cliente';
  a.cancelledAt = Date.now();
  await persistAppointments();
  pushAlert('cancelacion', `${a.clientName} canceló su cita del ${fmtDateShort(a.date)} ${a.time}`, {apptId:a.id});
  STATE.miCita.found = a;
  toast('Tu cita fue cancelada. El horario quedó disponible nuevamente.');
  render();
}

function todayISO(){ return toISODate(new Date()); }

function adminResumen(){
  const today = todayISO();
  const notCancelled = a => !['cancelada_cliente','cancelada_salon'].includes(a.status) && a.status!=='hold';
  const todays = STATE.appointments.filter(a=>a.date===today && notCancelled(a)).sort((a,b)=>a.time.localeCompare(b.time));
  const upcoming = STATE.appointments.filter(a=>a.date>today && notCancelled(a)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);
  const now = new Date();
  const weekAgo = new Date(now.getTime()-7*86400000);
  const monthAgo = new Date(now.getTime()-30*86400000);
  const newThisWeek = STATE.appointments.filter(a=>a.createdAt>=weekAgo.getTime()).length;
  const cancelledThisWeek = STATE.appointments.filter(a=>a.cancelledAt && a.cancelledAt>=weekAgo.getTime()).length;

  const incomeFor = (fromTs)=>STATE.appointments.filter(a=>a.status==='completada' && a.createdAt>=fromTs).reduce((s,a)=>s+a.totalPrice,0);
  const incomeToday = STATE.appointments.filter(a=>a.date===today && a.status==='completada').reduce((s,a)=>s+a.totalPrice,0);
  const incomeWeek = incomeFor(weekAgo.getTime());
  const incomeMonth = incomeFor(monthAgo.getTime());

  const svcCount = {};
  STATE.appointments.forEach(a=>{ if(notCancelled(a)) a.services.forEach(s=>{ svcCount[s.name]=(svcCount[s.name]||0)+1; }); });
  const topServices = Object.entries(svcCount).sort((a,b)=>b[1]-a[1]).slice(0,4);

  const recentAlerts = STATE.alerts.slice(0,8);

  return `
    <div class="section-head"><div><h2>Resumen</h2><p style="margin:0;">Vista general de la actividad del salón.</p></div></div>

      <div class="stat-card"><div class="n">${money(incomeMonth)}</div><div class="l">Ingresos del mes (completadas)</div></div>
    </div>
    <div class="grid-2">
      <div class="card">
        <h3>Citas de hoy</h3>
        ${todays.length? `<table class="dtable"><thead><tr><th>Hora</th><th>Clienta</th><th>Servicio</th><th>Estado</th></tr></thead><tbody>
          ${todays.map(a=>`<tr><td>${a.time}</td><td>${escapeHtml(a.clientName)}</td><td>${escapeHtml(a.services.map(s=>s.name).join(', '))}</td><td><span class="status-pill status-${a.status}">${statusLabel(a.status)}</span></td></tr>`).join('')}
        </tbody></table>` : '<div class="empty-state">No hay citas hoy.</div>'}
      </div>
      <div class="card">
        <h3>Próximas citas</h3>
        ${upcoming.length? `<table class="dtable"><thead><tr><th>Fecha</th><th>Clienta</th><th>Servicio</th></tr></thead><tbody>
          ${upcoming.map(a=>`<tr><td>${fmtDateShort(a.date)} ${a.time}</td><td>${escapeHtml(a.clientName)}</td><td>${escapeHtml(a.services.map(s=>s.name).join(', '))}</td></tr>`).join('')}
        </tbody></table>` : '<div class="empty-state">Sin próximas citas.</div>'}
      </div>
    </div>
    <div class="grid-2" style="margin-top:14px;">
      <div class="card">
        <h3>Servicios más solicitados</h3>
        ${topServices.length? topServices.map(([n,c])=>`<div class="row" style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);"><span>${escapeHtml(n)}</span><b>${c}</b></div>`).join('') : '<div class="empty-state">Aún no hay datos.</div>'}

/* ---------- Admin actions ---------- */
async function handleAdminAction(action, el){
  switch(action){
    case 'admin-login': {
      const email = document.getElementById('ad-email').value.trim();
      const pass = document.getElementById('ad-pass').value;
      const errEl = document.getElementById('ad-error');
      errEl.textContent = '';
      try{
        await auth.signInWithEmailAndPassword(email, pass);
        STATE.loading = true;
        render();
        // enterAdminSession se ejecuta automáticamente vía onAuthStateChanged
      } catch(e){
        errEl.textContent = 'Correo o contraseña incorrectos.';
      }
      break;
    }
    case 'admin-forgot-password': {
      const emailEl = document.getElementById('ad-email');
      const errEl = document.getElementById('ad-error');
      const infoEl = document.getElementById('ad-info');
      errEl.textContent = '';
      infoEl.textContent = '';
      const email = (emailEl.value || '').trim();
      if(!email){
        errEl.textContent = 'Escribe tu correo arriba y luego haz clic en "¿Olvidaste tu contraseña?".';
        break;
      }
      try{
        await auth.sendPasswordResetEmail(email);
        infoEl.textContent = 'Te enviamos un correo con instrucciones para restablecer tu contraseña. Revisa también spam.';
      } catch(e){
        errEl.textContent = 'No pudimos enviar el correo. Verifica que la dirección sea correcta.';
      }
      break;
    }
    case 'admin-copy-share-link': {
      const input = document.getElementById('share-link-input');
      input.select();
      try{ await navigator.clipboard.writeText(input.value); toast('Link copiado.'); }
      catch(e){ document.execCommand('copy'); toast('Link copiado.'); }
      break;
    }
    case 'admin-share-link-whatsapp': {
      const link = location.origin + location.pathname + '#t/' + STATE.tenantId;
      const msg = `Reserva tu cita en ${STATE.config.name} aquí: ${link}`;
      window.open(waLink('', msg), '_blank');
      break;
    }
    case 'admin-logout': {
      await auth.signOut();
      stopRealtimeSync();
      STATE.admin.loggedIn = false;
      STATE.tenantId = null;
      STATE.config = null;
      STATE.view = 'landing';
      location.hash = '';
      render();
      break;
    }
    case 'admin-tab': STATE.admin.tab = el.dataset.tab; STATE.admin.openAppt=null; render(); break;
    case 'admin-read-alert': {
      const al = STATE.alerts.find(a=>a.id===el.dataset.id);
      if(al){ al.read=true; await persistAlerts(); render(); }
      break;
    }
    case 'admin-delete-alert': {
      if(!confirm('¿Eliminar esta alerta?')) break;
      STATE.alerts = STATE.alerts.filter(a=>a.id!==el.dataset.id);
      await persistAlerts();
      render();
      break;
    }
    case 'admin-clear-alerts': {
      if(!confirm('¿Borrar TODO el historial de alertas? Esta acción no se puede deshacer.')) break;
      STATE.alerts = [];
      await persistAlerts();
      render();
      break;
    }
    case 'admin-clear-solicitudes': {
      if(!confirm('¿Borrar todas las solicitudes de contacto? Esta acción no se puede deshacer.')) break;
      STATE.alerts = STATE.alerts.filter(a=>a.type!=='whatsapp_solicitud');
      await persistAlerts();
      render();
      break;
    }
    case 'admin-open-appt': STATE.admin.openAppt = el.dataset.id; render(); break;
    case 'admin-close-modal': STATE.admin.openAppt=null; STATE.admin.editingService=null; STATE.admin.editingBreak=null; STATE.admin.editingBlock=false; STATE.admin.pendingServicePhoto=null; render(); break;
    case 'admin-save-appt': {
      const a = STATE.appointments.find(x=>x.id===el.dataset.id);
      const newStatus = document.getElementById('modal-status').value;
      const notes = document.getElementById('modal-notes').value;
      const wasCancelled = ['cancelada_cliente','cancelada_salon'].includes(a.status);
      const nowCancelled = newStatus==='cancelada_salon';
      a.status = newStatus; a.internalNotes = notes;
      if(nowCancelled && !wasCancelled){ a.cancelledAt = Date.now(); pushAlert('cancelacion', `Cita de ${a.clientName} cancelada por el salón`, {apptId:a.id}); }
      await persistAppointments();
      STATE.admin.openAppt=null;
      toast('Cita actualizada.');
      render();
      break;
    }
    case 'admin-export-csv': exportCSV(); break;
    case 'admin-filter-date': STATE.admin.apptFilters.date = el.value; render(); break;
    case 'admin-filter-service': STATE.admin.apptFilters.service = el.value; render(); break;
    case 'admin-filter-status': STATE.admin.apptFilters.status = el.value; render(); break;
    case 'admin-filter-q': STATE.admin.apptFilters.q = el.value; render(); break;

    case 'admin-new-service': STATE.admin.pendingServicePhoto=null; STATE.admin.editingService='new'; render(); break;
    case 'admin-edit-service': STATE.admin.pendingServicePhoto=null; STATE.admin.editingService=el.dataset.id; render(); break;
    case 'admin-toggle-service': {
      const s = serviceById(el.dataset.id); s.active = s.active===false; await persistServices(); render(); break;
    }
    case 'admin-delete-service': {
      if(!confirm('¿Eliminar este servicio?')) return;
      STATE.services = STATE.services.filter(s=>s.id!==el.dataset.id);
      await persistServices(); render(); break;
    }
    case 'admin-upload-service-photo': {
      const file = el.files && el.files[0];
      if(!file) return;
      const svcId = el.dataset.id;
      try{
        toast('Subiendo foto…');
        const dataUrl = await resizeImageFile(file, 700, 0.85);
        if(svcId && svcId!=='new'){
          const s = serviceById(svcId);
          if(s){ s.icon = dataUrl; await persistServices(); }
        } else {
          STATE.admin.pendingServicePhoto = dataUrl;
        }
        toast('Foto agregada.');
        render();
      }catch(err){ toast('No se pudo cargar la imagen. Intenta con otro archivo.', true); }
      break;
    }
    case 'admin-save-service': {
      const id = el.dataset.id;
      const durRaw = document.getElementById('sv-dur').value;
      const priceRaw = document.getElementById('sv-price').value;
      const data = {
        name: document.getElementById('sv-name').value.trim(),
        category: document.getElementById('sv-cat').value,
        description: document.getElementById('sv-desc').value.trim(),
        duration: durRaw==='' ? null : Number(durRaw),
        price: priceRaw==='' ? null : Number(priceRaw),
        icon: document.getElementById('sv-icon').value.trim()
      };
      if(!data.name){ toast('El servicio necesita un nombre.', true); return; }
      if(id){
        Object.assign(serviceById(id), data);
      } else {
        STATE.services.push({id:uid('sv'), active:true, ...data});
      }
      await persistServices();
      STATE.admin.editingService=null;
      STATE.admin.pendingServicePhoto=null;
      toast('Servicio guardado.');
      render();
      break;
    }

    case 'admin-toggle-day': {
      const d = el.dataset.day; STATE.config.hours[d].open = !STATE.config.hours[d].open;
      await persistConfig(); render(); break;
    }
    case 'admin-day-start': STATE.config.hours[el.dataset.day].start = el.value; await persistConfig(); break;
    case 'admin-day-end': STATE.config.hours[el.dataset.day].end = el.value; await persistConfig(); break;
    case 'admin-buffer': STATE.config.bufferMinutes = Number(el.value)||0; await persistConfig(); break;
    case 'admin-maxsim': STATE.config.maxSimultaneous = Math.max(1,Number(el.value)||1); await persistConfig(); break;
    case 'admin-slotinterval': STATE.config.slotIntervalMinutes = Math.max(5,Number(el.value)||30); await persistConfig(); break;
    case 'admin-advance': STATE.config.advanceBookingDays = Math.max(1,Number(el.value)||30); await persistConfig(); break;
    case 'admin-mincancel': STATE.config.minCancelHours = Math.max(0,Number(el.value)||0); await persistConfig(); break;

    case 'admin-new-break': STATE.admin.editingBreak='new'; render(); break;
    case 'admin-save-break': {
      STATE.config.breaks.push({id:uid('br'), day:document.getElementById('br-day').value, start:document.getElementById('br-start').value, end:document.getElementById('br-end').value});
      await persistConfig(); STATE.admin.editingBreak=null; render(); break;
    }
    case 'admin-delete-break': STATE.config.breaks = STATE.config.breaks.filter(b=>b.id!==el.dataset.id); await persistConfig(); render(); break;

    case 'admin-new-block': STATE.admin.editingBlock=true; render(); break;
    case 'admin-save-block': {
      const date = document.getElementById('bl-date').value;
      if(!date){ toast('Elige una fecha.', true); return; }
      const allDay = document.getElementById('bl-allday').checked;
      STATE.config.blockedDates.push({
        id: uid('bk'), date, allDay,
        startTime: allDay?null:document.getElementById('bl-start').value,
        endTime: allDay?null:document.getElementById('bl-end').value,
        reason: document.getElementById('bl-reason').value.trim()
      });
      await persistConfig(); STATE.admin.editingBlock=false; render(); break;
    }
    case 'admin-delete-block': STATE.config.blockedDates = STATE.config.blockedDates.filter(b=>b.id!==el.dataset.id); await persistConfig(); render(); break;

    case 'admin-req-status': {
      const al = STATE.alerts.find(a=>a.id===el.dataset.id);
      if(al){ al.status = el.value; al.read=true; await persistAlerts(); render(); }
      break;
    }

    case 'admin-upload-logo': {
      const file = el.files && el.files[0];
      if(!file) return;
      try{
        toast('Subiendo logo…');
        const dataUrl = await resizeImageFile(file, 300, 0.88);
        STATE.config.logo = dataUrl;
        await persistConfig();
        toast('Logo actualizado.');
        render();
      }catch(err){ toast('No se pudo cargar la imagen. Intenta con otro archivo.', true); }
      break;
    }
    case 'admin-upload-hero': {
      const file = el.files && el.files[0];
      if(!file) return;
      try{
        toast('Subiendo imagen…');
        const dataUrl = await resizeImageFile(file, 1400, 0.82);
        STATE.config.heroImage = dataUrl;
        await persistConfig();
        toast('Imagen destacada actualizada.');
        render();
      }catch(err){ toast('No se pudo cargar la imagen. Intenta con otro archivo.', true); }
      break;
    }
    case 'admin-toggle-payments': STATE.config.paymentsEnabled = !STATE.config.paymentsEnabled; await persistConfig(); render(); break;
    case 'admin-cfg': {
      const field = el.dataset.field;
      let val = el.value;
      if(['depositAmount'].includes(field)) val = Number(val)||0;
      STATE.config[field] = val;
      await persistConfig();
      if(field==='logo' || field==='heroImage') render();
      break;
    }
    case 'admin-theme': {
      const field = el.dataset.field;
      if(!STATE.config.theme) STATE.config.theme = defaultTheme();
      STATE.config.theme[field] = el.value;
      applyTheme();
      await persistConfig();
      break;
    }
    case 'admin-theme-reset': {
      STATE.config.theme = defaultTheme();
      applyTheme();
      await persistConfig();
      render();
      toast('Colores restaurados.');
      break;
    }
    case 'admin-new-promo': {
      const title = prompt('Título de la promoción:');
      if(!title) return;
      const description = prompt('Descripción breve:') || '';
      STATE.config.promos.push({id:uid('pr'), title, description});
      await persistConfig(); render(); break;
    }
    case 'admin-delete-promo': STATE.config.promos = STATE.config.promos.filter(p=>p.id!==el.dataset.id); await persistConfig(); render(); break;
  }
}

function exportCSV(){
  const rows = [['Código','Fecha','Hora','Clienta','Teléfono','Servicios','Precio total','Estado']];
  STATE.appointments.filter(a=>a.status!=='hold').forEach(a=>{
    rows.push([a.code, a.date, a.time, a.clientName, a.clientPhone, a.services.map(s=>s.name).join(' + '), a.totalPrice, statusLabel(a.status)]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='citas.csv'; a.click();
  URL.revokeObjectURL(url);
}

// admin config inputs use 'change' for selects/text — hook into oninput already covers text/number via generic path below
document.addEventListener('change', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  // "admin-close-modal" solo debe dispararse por un clic directo en el fondo del modal,
  // nunca por un evento 'change' que burbujea desde un campo dentro del modal (select, input, etc.)
  if(el.dataset.action === 'admin-close-modal') return;
  onAppClick({target:el});
});

init();
</script>
